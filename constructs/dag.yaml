# The construct DAG: one entry per construct page in constructs/.
# Edit freely, then run `python scripts/sync_constructs.py` to update the pages.
#   title:        the page title (a field prefix such as "Retrieval effectiveness: ..." is fine)
#   broader:      parent construct ids; several parents are allowed (it is a DAG, not a tree)
#   renamed_from: (optional, one-off) the old id when renaming; removed after the sync
# Adding an entry creates a stub page. Removing an entry stops the sync until the page is deleted or
# merged by hand. Comments in this file are not kept when the script rewrites it; only this header is.
# Entries are listed parents first.

component-characteristics:
  title: Component characteristics
  broader: []

component-performance:
  title: Component performance
  broader: [component-characteristics]

classification-performance:
  title: Classification performance
  broader: [component-performance]

classification-correctness:
  title: "Classification effectiveness: correctness"
  broader: [classification-performance]

retrieval-performance:
  title: Retrieval performance
  broader: [component-performance]

retrieval-effectiveness:
  title: Retrieval effectiveness
  broader: [retrieval-performance]

relevance:
  title: "Retrieval effectiveness: relevance"
  broader: [retrieval-effectiveness]

timeliness:
  title: "Retrieval effectiveness: timeliness"
  broader: [relevance]

topical-relevance:
  title: "Retrieval effectiveness: topical relevance"
  broader: [relevance]

retrieval-efficiency:
  title: Retrieval efficiency
  broader: [retrieval-performance]

system-characteristics:
  title: System characteristics
  broader: []

system-performance:
  title: System performance
  broader: [system-characteristics]

output-quality:
  title: Output quality
  broader: [system-performance]

trustworthiness:
  title: Trustworthiness
  broader: [relevance, output-quality]

responsiveness:
  title: System responsiveness
  broader: [system-performance]

task-characteristics:
  title: Task characteristics
  broader: []

task-performance:
  title: Task performance
  broader: [task-characteristics]

usability:
  title: Usability
  broader: [task-characteristics]

task-effectiveness:
  title: Task effectiveness
  broader: [task-performance, usability]

task-efficiency:
  title: Task efficiency
  broader: [task-performance, usability]

mental-workload:
  title: Mental workload
  broader: [task-efficiency]

perceived-usability:
  title: "Usability: perceived usability"
  broader: [usability]

user-characteristics:
  title: User characteristics
  broader: []

literacy:
  title: Literacy
  broader: [user-characteristics]

ai-literacy:
  title: "Literacy: AI literacy"
  broader: [literacy]

information-literacy:
  title: "Literacy: information literacy"
  broader: [literacy]

visualization-literacy:
  title: "Literacy: visualization literacy"
  broader: [literacy]
